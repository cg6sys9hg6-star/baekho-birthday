<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백호 생일선물 압수물 보관소</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e9e5dc;
      color: #252525;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: min(1100px, 94%);
      margin: 0 auto;
      padding: 30px 0 60px;
      text-align: center;
    }

    .official {
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 56px);
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 12px 0 30px;
      font-size: 14px;
      color: #666;
    }

    .notice {
      display: inline-block;
      border: 1px solid #888;
      padding: 8px 18px;
      margin-bottom: 25px;
      font-size: 13px;
      background: #f7f5ef;
    }

    /* 백호와 선물이 들어가는 공간 */
    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #d8d0c1;
      border: 3px solid #383838;
      overflow: hidden;
    }

    .scene::before {
      content: "SPECIAL STORAGE ROOM";
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #777;
      z-index: 100;
    }

    /* 백호 */
    .baekho-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
    }

    /* 선물들이 올라가는 공간 */
    .gift-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

.gift-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}

    .gift-image.show {
      opacity: 1;
    }

    /* 선물 위치 */
.gift-01,
.gift-02,
.gift-03,
.gift-04,
.gift-05,
.gift-06,
.gift-07,
.gift-08,
.gift-09,
.gift-10,
.gift-11,
.gift-12,
.gift-13,
.gift-14,
.gift-15,
.gift-16,
.gift-17,
.gift-18,
.gift-19,
.gift-20,
.gift-21,
.gift-22,
.gift-23,
.gift-24,
.gift-25,
.gift-26,
.gift-27 {
  transform: none;
}

    /* 숫자 */
    .count {
      margin-top: 30px;
      font-size: 18px;
    }

    .count strong {
      display: block;
      font-size: 48px;
      margin-top: 5px;
      letter-spacing: 3px;
    }

    /* 버튼 */
    button {
      margin-top: 25px;
      padding: 14px 28px;
      border: 2px solid #333;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    .footer {
      margin-top: 50px;
      font-size: 12px;
      color: #777;
    }

    /* 작은 화면 */
    @media (max-width: 600px) {
      .container {
        width: 96%;
        padding-top: 20px;
      }

      .official {
        font-size: 10px;
      }

      .subtitle {
        font-size: 12px;
      }

      .notice {
        font-size: 11px;
      }

      .scene::before {
        top: 10px;
        left: 10px;
        font-size: 8px;
      }

      .count {
        font-size: 15px;
      }

      .count strong {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="official">
      大韓民國 檢察廳 · 특별보관 제2026-BH호
    </div>

    <h1>
      백호 생일선물<br>
      압수물 보관소
    </h1>

    <div class="subtitle">
      백호의 생일을 축하하기 위해 제출된 선물을 보관하고 있습니다.
    </div>

    <div class="notice">
      본 보관소의 모든 압수물은 백호에게 전달될 예정입니다.
    </div>

    <section class="scene">

      <!-- 백호 -->
      <img
        id="baekho"
        class="baekho-image"
        src="baekho_work.png"
        alt="업무 중인 백호"
      >

      <!-- 선물 -->
      <div class="gift-area" id="giftArea"></div>

    </section>

    <div class="count">
      현재 보관 중인 압수물
      <strong id="count">000</strong>
    </div>

    <button id="giftButton">
      🎁 생일선물 하나 추가해보기
    </button>

    <div class="footer">
      CASE NO. BH-2026-BIRTHDAY<br>
      Baekho Birthday Gift Archive
    </div>

  </main>


  <script>

  /* 선물 파일 목록 */
  const gifts = [
    "gift01.png",
    "gift02.png",
    "gift03.png",
    "gift04.png",
    "gift05.png",
    "gift06.png",
    "gift07.png",
    "gift08.png",
    "gift09.png",
    "gift10.png",
    "gift11.png",
    "gift12.png",
    "gift13.png",
    "gift14.png",
    "gift15.png",
    "gift16.png",
    "gift17.png",
    "gift18.png",
    "gift19.png",
    "gift20.png",
    "gift21.png",
    "gift22.png",
    "gift23.png",
    "gift24.png",
    "gift25.png",
    "gift26.png",
    "gift27.png"
  ];

  const giftArea = document.getElementById("giftArea");
  const countText = document.getElementById("count");
  const button = document.getElementById("giftButton");
  const baekho = document.getElementById("baekho");

  let giftCount = 0;
  let smileTimer;


  /* 선물 27개 준비 */
  gifts.forEach((fileName, index) => {

    const img = document.createElement("img");

    img.src = fileName;
    img.alt = "";

    img.classList.add(
      "gift-image",
      "gift-" + String(index + 1).padStart(2, "0")
    );

    img.style.zIndex = 10 + index;

    giftArea.appendChild(img);

  });


  /* 숫자 표시 */
  function updateCount() {

    countText.textContent =
      String(giftCount).padStart(3, "0");

  }


  /* 선물 하나 추가 */
  function addGift() {

    /* 이번 사이클에서 몇 번째 선물인지 계산 */
    const giftIndex = giftCount % gifts.length;

    const giftImages =
      document.querySelectorAll(".gift-image");


    /* 28번째, 55번째... 새로운 사이클이 시작되면 */
    if (giftIndex === 0 && giftCount > 0) {

      giftImages.forEach((img) => {
        img.classList.remove("show");
      });

    }


    /* 이번 선물 보여주기 */
    giftImages[giftIndex].classList.add("show");


    /* 전체 제출 횟수는 계속 증가 */
    giftCount++;

    updateCount();


    /* 백호가 3초 동안 웃음 */
    baekho.src = "baekho_smile.png";
    baekho.alt = "웃는 백호";

    clearTimeout(smileTimer);

    smileTimer = setTimeout(() => {

      baekho.src = "baekho_work.png";
      baekho.alt = "업무 중인 백호";

    }, 3000);

  }


  /* 버튼 클릭 */
  button.addEventListener("click", addGift);

  updateCount();

</script>
</body>
</html>
