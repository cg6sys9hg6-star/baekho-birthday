<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백호 생일선물 압수물 보관소</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e9e5dc;
      color: #252525;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: min(1100px, 94%);
      margin: 0 auto;
      padding: 30px 0 60px;
      text-align: center;
    }

    .official {
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 56px);
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 12px 0 30px;
      font-size: 14px;
      color: #666;
    }

    .notice {
      display: inline-block;
      border: 1px solid #888;
      padding: 8px 18px;
      margin-bottom: 25px;
      font-size: 13px;
      background: #f7f5ef;
    }

    /* 백호와 선물이 들어가는 공간 */
    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #d8d0c1;
      border: 3px solid #383838;
      overflow: hidden;
    }

    .scene::before {
      content: "SPECIAL STORAGE ROOM";
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #777;
      z-index: 100;
    }

    /* 백호 */
    .baekho-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
    }

    /* 선물들이 올라가는 공간 */
    .gift-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

.gift-image {
  position: absolute;
  width: 180px;
  height: 135px;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}

    .gift-image.show {
      opacity: 1;
    }

    /* 선물 위치 */
    .gift-01 {
      transform: translate(-55%, 8%);
    }

    .gift-02 {
      transform: translate(-38%, 6%);
    }

    .gift-03 {
      transform: translate(-22%, 10%);
    }

    .gift-04 {
      transform: translate(-8%, 5%);
    }

    .gift-05 {
      transform: translate(8%, 10%);
    }

    .gift-06 {
      transform: translate(22%, 5%);
    }

    .gift-07 {
      transform: translate(-48%, -3%);
    }

    .gift-08 {
      transform: translate(-30%, -2%);
    }

    .gift-09 {
      transform: translate(-12%, -4%);
    }

    .gift-10 {
      transform: translate(5%, -2%);
    }

    .gift-11 {
      transform: translate(20%, -5%);
    }

    .gift-12 {
      transform: translate(35%, -3%);
    }

    .gift-13 {
      transform: translate(-43%, -12%);
    }

    .gift-14 {
      transform: translate(-25%, -10%);
    }

    .gift-15 {
      transform: translate(-7%, -12%);
    }

    .gift-16 {
      transform: translate(12%, -10%);
    }

    .gift-17 {
      transform: translate(28%, -13%);
    }

    .gift-18 {
      transform: translate(-35%, -19%);
    }

    .gift-19 {
      transform: translate(-17%, -18%);
    }

    .gift-20 {
      transform: translate(1%, -20%);
    }

    .gift-21 {
      transform: translate(18%, -18%);
    }

    .gift-22 {
      transform: translate(-28%, -26%);
    }

    .gift-23 {
      transform: translate(-10%, -25%);
    }

    .gift-24 {
      transform: translate(8%, -27%);
    }

    .gift-25 {
      transform: translate(-19%, -33%);
    }

    .gift-26 {
      transform: translate(0%, -32%);
    }

    .gift-27 {
      transform: translate(-8%, -39%);
    }

    /* 숫자 */
    .count {
      margin-top: 30px;
      font-size: 18px;
    }

    .count strong {
      display: block;
      font-size: 48px;
      margin-top: 5px;
      letter-spacing: 3px;
    }

    /* 버튼 */
    button {
      margin-top: 25px;
      padding: 14px 28px;
      border: 2px solid #333;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    .footer {
      margin-top: 50px;
      font-size: 12px;
      color: #777;
    }

    /* 작은 화면 */
    @media (max-width: 600px) {
      .container {
        width: 96%;
        padding-top: 20px;
      }

      .official {
        font-size: 10px;
      }

      .subtitle {
        font-size: 12px;
      }

      .notice {
        font-size: 11px;
      }

      .scene::before {
        top: 10px;
        left: 10px;
        font-size: 8px;
      }

      .count {
        font-size: 15px;
      }

      .count strong {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="official">
      大韓民國 檢察廳 · 특별보관 제2026-BH호
    </div>

    <h1>
      백호 생일선물<br>
      압수물 보관소
    </h1>

    <div class="subtitle">
      백호의 생일을 축하하기 위해 제출된 선물을 보관하고 있습니다.
    </div>

    <div class="notice">
      본 보관소의 모든 압수물은 백호에게 전달될 예정입니다.
    </div>

    <section class="scene">

      <!-- 백호 -->
      <img
        id="baekho"
        class="baekho-image"
        src="baekho_work.png"
        alt="업무 중인 백호"
      >

      <!-- 선물 -->
      <div class="gift-area" id="giftArea"></div>

    </section>

    <div class="count">
      현재 보관 중인 압수물
      <strong id="count">000</strong>
    </div>

    <button id="giftButton">
      🎁 생일선물 하나 추가해보기
    </button>

    <div class="footer">
      CASE NO. BH-2026-BIRTHDAY<br>
      Baekho Birthday Gift Archive
    </div>

  </main>


  <script>

  /* 선물 파일 목록 */
const gifts = [
  "gift01.png",
  "gift02.png",
  "gift03.png",
  "gift04.png",
  "gift05.png",
  "gift06.png",
  "gift07.png",
  "gift08.png",
  "gift09.png",
  "gift10.png",
  "gift11.png",
  "gift12.png",
  "gift13.png",
  "gift14.png",
  "gift15.png",
  "gift16.png",
  "gift17.png",
  "gift18.png",
  "gift19.png",
  "gift20.png",
  "gift21.png",
  "gift22.png",
  "gift23.png",
  "gift24.png",
  "gift25.png",
  "gift26.png",
  "gift27.png"
];

  const giftArea = document.getElementById("giftArea");
  const countText = document.getElementById("count");
  const button = document.getElementById("giftButton");
  const baekho = document.getElementById("baekho");

  let giftCount = 0;
let smileTimer;


  /* 선물 27개 준비 */
  gifts.forEach((fileName, index) => {

    const img = document.createElement("img");

    /* 한글과 공백이 들어간 파일명을 안전하게 변환 */
    img.src = encodeURI(fileName);

    /* 이미지가 없을 때 글자가 나타나지 않도록 함 */
    img.alt = "";

    img.classList.add(
      "gift-image",
      "gift-" + String(index + 1).padStart(2, "0")
    );

    img.style.zIndex = 10 + index;

    giftArea.appendChild(img);

  });


  /* 숫자 표시 */
  function updateCount() {

    countText.textContent =
      String(giftCount).padStart(3, "0");

  }


  /* 선물 하나 추가 */
  function addGift() {

    if (giftCount >= gifts.length) {
      return;
    }

    const giftImages =
      document.querySelectorAll(".gift-image");

    giftImages[giftCount].classList.add("show");

    giftCount++;

    updateCount();


/* 선물이 들어올 때마다 백호가 3초 동안 웃음 */
baekho.src = "baekho_smile.png";
baekho.alt = "웃는 백호";

clearTimeout(smileTimer);

smileTimer = setTimeout(() => {
  baekho.src = "baekho_work.png";
  baekho.alt = "업무 중인 백호";
}, 3000);

  }


  button.addEventListener("click", addGift);

  updateCount();

</script>
</body>
</html>
