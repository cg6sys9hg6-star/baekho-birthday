<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>백호 생일선물 압수물 보관소</title>

  <style>
    /* ================================================
       기본 설정
       ================================================ */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e9e5dc;
      color: #252525;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: min(1100px, 94%);
      margin: 0 auto;
      padding: 30px 0 60px;
      text-align: center;
    }


    /* ================================================
       상단 제목
       ================================================ */

    .official {
      margin-bottom: 12px;
      font-size: 13px;
      letter-spacing: 2px;
    }

    h1 {
      margin: 0;
      font-family: "궁서", "Gungsuh", "Batang", serif;
      font-size: clamp(28px, 6vw, 56px);
      letter-spacing: 2px;
      line-height: 1.4;
    }

    .subtitle {
      margin: 12px 0 30px;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .notice {
      display: inline-block;
      max-width: 100%;
      margin-bottom: 25px;
      padding: 12px 18px;
      border: 1px solid #888;
      background: #f7f5ef;
      font-size: 13px;
      line-height: 1.6;
    }


    /* ================================================
       백호 장면
       GIF와 안내문을 겹쳐 표시
       ================================================ */

    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #d8d0c1;
      border: 3px solid #383838;
    }

    .scene::before {
      content: "© 티캣 2026";
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 3;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
      pointer-events: none;
    }

    /* 백호 애니메이션 */

    .baekho-image {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* 안내문 및 말풍선 */

    .notice-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;

      /* 흰 배경은 투명하게 보이고,
         검은 선과 글자는 위에 남도록 처리 */

      mix-blend-mode: normal;

      pointer-events: none;
    }


    /* ================================================
       압수물 개수
       ================================================ */

    .count {
      margin-top: 30px;
      font-size: 18px;
      line-height: 1.7;
    }

    .count strong {
      display: block;
      margin-top: 5px;
      font-size: clamp(44px, 10vw, 64px);
      line-height: 1.3;
      letter-spacing: 5px;
      font-weight: bold;
    }


    /* ================================================
       사건 종결 안내문
       ================================================ */

    .closed-notice {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 120px;

      margin-top: 25px;
      padding: 24px 16px;

      background: #333;
      border: 3px solid #333;
      color: #fff;

      font-size: clamp(20px, 4.5vw, 30px);
      font-weight: normal;
      letter-spacing: 1px;
      line-height: 1.5;
    }


    /* ================================================
       하단 사건 기록
       ================================================ */

    .footer {
      margin-top: 45px;
      color: #777;
      font-size: 12px;
      line-height: 1.9;
    }

    .footer .case-number {
      margin-bottom: 10px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .footer .archive-status {
      margin-top: 20px;
      color: #444;
      font-size: 11px;
      letter-spacing: 2px;
    }


    /* ================================================
       모바일
       ================================================ */

    @media (max-width: 600px) {

      .container {
        width: 96%;
        padding-top: 20px;
        padding-bottom: 40px;
      }

      .official {
        font-size: 10px;
        letter-spacing: 1px;
      }

      .subtitle {
        margin-bottom: 20px;
        font-size: 12px;
      }

      .notice {
        margin-bottom: 20px;
        padding: 10px 12px;
        font-size: 12px;
      }

      .scene::before {
        top: 10px;
        left: 10px;
        font-size: 8px;
      }

      .count {
        margin-top: 25px;
        font-size: 15px;
      }

      .closed-notice {
        min-height: 100px;
        margin-top: 20px;
      }

      .footer {
        margin-top: 35px;
        font-size: 11px;
      }
    }

  </style>
</head>


<body>

  <main class="container">

    <!-- ============================================
         상단 제목
         ============================================ -->

    <div class="official">
      대한민국 검찰청 · 특별보관 제2026-BH호
    </div>

    <h1>
      백호 생일선물<br>
      압수물 보관소
    </h1>

    <div class="subtitle">
      백호의 생일을 축하하기 위해 제출된 선물을 보관하고 있습니다.
    </div>

    <div class="notice">
      본 보관소의 모든 압수물은 백호에게 전달될 예정입니다.
    </div>


    <!-- ============================================
         백호 GIF 및 안내문
         ============================================ -->

    <section class="scene">

      <img
        class="baekho-image"
        src="baekho_ani.gif"
        alt="백호 검사실 정리 중"
      >

      <img
        class="notice-overlay"
        src="baekho_notice.png"
        alt="압수물 과다 접수로 업무 지연 중"
      >

    </section>


    <!-- ============================================
         압수물 개수
         ============================================ -->

    <div class="count">

      현재 보관 중인 압수물

      <strong>200</strong>

    </div>


    <!-- ============================================
         사건 종결 안내문
         ============================================ -->

    <div class="closed-notice">
      생일 사건 후속 조치 중
    </div>


    <!-- ============================================
         하단 사건 기록
         ============================================ -->

    <footer class="footer">

      <div class="case-number">
        CASE NO. BH-2026-BIRTHDAY
      </div>

      Baekho Birthday Gift Archive

      <br><br>

      본 사이트는 실제 대한민국 검찰청 및 국가기관과 관련이 없는<br>
      퇴마록 캐릭터 백호의 비공식 팬메이드 생일 이벤트 사이트입니다.

      <div class="archive-status">
        CASE CLOSED · ARCHIVE PRESERVED
      </div>

    </footer>

  </main>

</body>
</html>
