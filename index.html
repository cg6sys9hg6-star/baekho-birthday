<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백호 생일선물 압수물 보관소</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e9e5dc;
      color: #252525;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: min(1100px, 94%);
      margin: 0 auto;
      padding: 30px 0 60px;
      text-align: center;
    }

    .official {
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 56px);
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 12px 0 30px;
      font-size: 14px;
      color: #666;
    }

    .notice {
      display: inline-block;
      border: 1px solid #888;
      padding: 8px 18px;
      margin-bottom: 25px;
      font-size: 13px;
      background: #f7f5ef;
    }

    .scene {
      position: relative;
      min-height: 600px;
      background: #d8d0c1;
      border: 3px solid #383838;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .scene::before {
      content: "SPECIAL STORAGE ROOM";
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #777;
    }

    .baekho-image {
  width: 100%;
  max-width: 900px;
  height: auto;
  display: block;
  margin: 0 auto;
}

    .gift-area {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      height: 180px;
      pointer-events: none;
    }

    .gift {
      position: absolute;
      font-size: 42px;
    }

    .gift:nth-child(1) { left: 3%; bottom: 5px; }
    .gift:nth-child(2) { left: 13%; bottom: 15px; }
    .gift:nth-child(3) { left: 23%; bottom: 2px; }
    .gift:nth-child(4) { right: 23%; bottom: 5px; }
    .gift:nth-child(5) { right: 13%; bottom: 20px; }
    .gift:nth-child(6) { right: 3%; bottom: 0; }

    .count {
      margin-top: 30px;
      font-size: 18px;
    }

    .count strong {
      display: block;
      font-size: 48px;
      margin-top: 5px;
    }

    button {
      margin-top: 25px;
      padding: 14px 28px;
      border: 2px solid #333;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    .footer {
      margin-top: 50px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="official">
      大韓民國 檢察廳 · 특별보관 제2026-BH호
    </div>

    <h1>백호 생일선물<br>압수물 보관소</h1>

    <div class="subtitle">
      백호의 생일을 축하하기 위해 제출된 선물을 보관하고 있습니다.
    </div>

    <div class="notice">
      본 보관소의 모든 압수물은 백호에게 전달될 예정입니다.
    </div>

    <section class="scene">

      <img class="baekho-image" src="baekho_work.png" alt="업무 중인 백호">

      <div class="gift-area">
        <div class="gift">🎁</div>
        <div class="gift">🎁</div>
        <div class="gift">🎁</div>
        <div class="gift">🎁</div>
        <div class="gift">🎁</div>
        <div class="gift">🎁</div>
      </div>

    </section>

    <div class="count">
      현재 보관 중인 압수물
      <strong>000</strong>
    </div>

    <button>
      🎁 생일선물 제출하기
    </button>

    <div class="footer">
      CASE NO. BH-2026-BIRTHDAY<br>
      Baekho Birthday Gift Archive
    </div>

  </main>

</body>
</html>
